# yaml-language-server: $schema=../.helm-shared/values.schema.json

# shared values for all services

global:
  domain: p46
  location: bl46p
  enabled: true

# shared settings for all IOC types
shared: &shared
  # hostNetwork
  # set to true for Channel Access to work outside of the cluster (or use a gateway)
  hostNetwork: true

  # running as ixxdetector account uid,gid gives access to /dls/ixx/data
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 37890
    runAsGroup: 37890

  # nodeSelector and tolerations to get the right nodes on pollux
  nodeSelector: &nodeSelector
    beamline: p46

  tolerations: &tolerations
    - key: beamline
      operator: Equal
      value: p46
      effect: NoSchedule
    - key: nodetype
      operator: Equal
      value: training-rig
      effect: NoSchedule

# shared settings for all ibek IOCs using the ioc-instance helm chart
ioc-instance:
  <<: *shared

# shared setting for all legacy IOCs using the dev-c7 helm chart
dev-c7:
  <<: *shared

epics-pvcs:
  <<: *shared

# the same scheduling for the services, by the key each chart reads
# (root for local charts p46-proxy and p46-opa, else the subchart alias)
nodeSelector: *nodeSelector
tolerations: *tolerations

blueapi:
  nodeSelector: *nodeSelector
  tolerations: *tolerations

oauth2:
  nodeSelector: *nodeSelector
  tolerations: *tolerations

nexus-file-converter:
  nodeSelector: *nodeSelector
  tolerations: *tolerations

tiled:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
